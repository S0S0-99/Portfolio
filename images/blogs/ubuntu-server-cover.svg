<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#1b1e2b"/>
    </linearGradient>
    <linearGradient id="ub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#77216F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#f5f5f5" text-anchor="middle">Serveur de test — applications internes</text>
  <text x="600" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#9aa0b4" text-anchor="middle">Ubuntu · Nginx (reverse proxy) · Node.js · PM2</text>

  <!-- Flux client -> nginx -> node -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e6e6e6">
    <g transform="translate(200,320)">
      <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#232636" stroke="#3a3f55" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle">🌐 Requête client</text>
    </g>

    <g transform="translate(600,320)">
      <rect x="-110" y="-45" width="220" height="90" rx="14" fill="url(#ub)"/>
      <text x="0" y="-10" font-weight="700" fill="#fff" text-anchor="middle">Nginx</text>
      <text x="0" y="14" font-size="14" fill="#f7e9e4" text-anchor="middle">reverse proxy</text>
    </g>

    <g transform="translate(1000,320)">
      <rect x="-95" y="-30" width="190" height="60" rx="10" fill="#232636" stroke="#3a3f55" stroke-width="1.5"/>
      <text x="0" y="6" text-anchor="middle">⚙️ Node.js (PM2)</text>
    </g>
  </g>

  <g stroke="#5a6180" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M290,320 L488,320"/>
    <path d="M712,320 L903,320"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6180"/>
    </marker>
  </defs>

  <text x="600" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8a90ab" text-anchor="middle">Serveur Ubuntu — environnement de test isolé de la production</text>

  <text x="600" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6b7190" text-anchor="middle">Ubuntu · Nginx · Node.js · PM2</text>
</svg>
