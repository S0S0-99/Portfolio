<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#1b1e2b"/>
    </linearGradient>
    <linearGradient id="npm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2496ED"/>
      <stop offset="100%" stop-color="#0B5CAD"/>
    </linearGradient>
    <linearGradient id="dvwa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b3261e"/>
      <stop offset="100%" stop-color="#5a1a1a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6180"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="600" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#f5f5f5" text-anchor="middle">Lab Cybersécurité &amp; Conteneurisation</text>
  <text x="600" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#9aa0b4" text-anchor="middle">Docker Compose · Nginx Proxy Manager · DVWA</text>

  <!-- Client -->
  <g transform="translate(170,330)" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#e6e6e6">
    <rect x="-85" y="-30" width="170" height="60" rx="10" fill="#232636" stroke="#3a3f55" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle">🌐 Navigateur</text>
  </g>

  <!-- Réseau Docker isolé -->
  <rect x="340" y="200" width="800" height="260" rx="18" fill="none" stroke="#2496ED" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="360" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2496ED">🐳 Réseau Docker isolé (Docker Compose)</text>

  <!-- Nginx Proxy Manager -->
  <g transform="translate(550,330)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="-110" y="-45" width="220" height="90" rx="14" fill="url(#npm)"/>
    <text x="0" y="-8" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Nginx Proxy Manager</text>
    <text x="0" y="16" font-size="14" fill="#dbeeff" text-anchor="middle">reverse proxy</text>
  </g>

  <!-- DVWA -->
  <g transform="translate(940,330)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="-110" y="-45" width="220" height="90" rx="14" fill="url(#dvwa)"/>
    <text x="0" y="-8" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">DVWA</text>
    <text x="0" y="16" font-size="14" fill="#f7d6d3" text-anchor="middle">cible d'entraînement</text>
  </g>

  <!-- Flèches -->
  <g stroke="#5a6180" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M255,330 L428,330"/>
    <path d="M662,330 L818,330"/>
  </g>

  <text x="600" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6b7190" text-anchor="middle">Docker · Docker Compose · Nginx Proxy Manager · DVWA</text>
</svg>
